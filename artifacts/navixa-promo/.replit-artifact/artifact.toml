kind = "video"
previewPath = "/navixa-promo/"
title = "Navixa Promo Video"
version = "1.0.0"
id = "artifacts/fleet-arena-promo"
router = "path"

[[services]]
name = "web"
paths = [ "/navixa-promo/" ]
localPort = 25735

[services.development]
run = "pnpm --filter @workspace/navixa-promo run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/navixa-promo", "run", "build" ]
serve = "static"
publicDir = "artifacts/navixa-promo/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25735"
BASE_PATH = "/navixa-promo/"
