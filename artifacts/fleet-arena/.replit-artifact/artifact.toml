kind = "mobile"
previewPath = "/"
title = "Fleet Arena"
version = "1.0.0"
id = "artifacts/fleet-arena"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 19262

[services.development]
run = "pnpm --filter @workspace/fleet-arena run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/fleet-arena", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/fleet-arena", "run", "serve" ]

[services.env]
PORT = "19262"
BASE_PATH = "/"
